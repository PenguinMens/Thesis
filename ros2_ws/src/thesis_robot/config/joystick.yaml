joy_node:
  ros__parameters:
    device_id: 0
    deadzone: 0.05
    autorepeat_rate: 20.0

teleop_node:
  ros__parameters:
    axis_linear:
      x: 1
    scale_linear:
      x: 0.5
    scale_linear_turbo:
      x: 1.0

    axis_angular:
      yaw: 0
    scale_angular:
      yaw: 1.5    # Inverted angular scale to correct the direction
    scale_angular_turbo:
      yaw: 3.0    # Inverted for turbo mode too

    enable_button: 5
    enable_turbo_button: 6

    require_enable_button: true
