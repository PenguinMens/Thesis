ekf_filter_node:
  ros__parameters:
    frequency: 20.0
    sensor_timeout: 0.1
    world_frame: odom
    base_link_frame: base_link
    odom_frame: odom
    map_frame: map
    two_d_mode: true
    publish_tf: true
    odom0: /diffbot_base_controller/odom
    odom0_config: [false, false, false,
                    false, false, false,
                    true, true, false,
                    false, false, true,
                    false, false, false]
    odom0_differential: false

  #https://docs.ros.org/en/melodic/api/robot_localization/html/preparing_sensor_data.html
  # take about diff or relative
    imu0: /imu/data
    imu0_config: [false, false, false,
                    false, false, true,
                    false, false, false,
                    false, false, true,
                    true, false, false]
    imu0_differential: false

# [x_pos   , y_pos    , z_pos,
#  roll    , pitch    , yaw,
#  x_vel   , y_vel    , z_vel,
#  roll_vel, pitch_vel, yaw_vel,
#  x_accel , y_accel  , z_accel]